name: tick
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - ".github/workflows/tick.yml"
permissions:
  contents: write
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tunggu Vercel selesai deploy (hanya saat commit)
        if: github.event_name == 'push'
        run: sleep 80
      - name: panggil bot di Vercel
        env:
          URL: ${{ secrets.VERCEL_APP_URL }}
          S: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ]; then echo "::error::Secret VERCEL_APP_URL kosong"; exit 1; fi
          if [ -z "$S" ]; then echo "::error::Secret CRON_SECRET kosong"; exit 1; fi
          SIDIK=$(printf %s "$S" | sha256sum | cut -c1-6)
          echo "github_panjang=${#S} github_sidik=$SIDIK"
          code=$(curl -sS -o resp.txt -w "%{http_code}" --max-time 120 -H "Authorization: Bearer $S" "$URL/api/tick" || echo 000)
          echo "HTTP $code"
          echo "$(cat resp.txt)"
          if [ "$code" != "200" ]; then echo "::error::tick gagal HTTP $code | github=${#S}/$SIDIK | server=$(head -c 300 resp.txt)"; exit 1; fi
      - name: simpan log mentah ke repo
        if: always()
        env:
          URL: ${{ secrets.VERCEL_APP_URL }}
          S: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p data_bot
          curl -fsS --max-time 120 -H "Authorization: Bearer $S" "$URL/api/export" -o data_bot/export_log_mentah.json || exit 0
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data_bot
          git diff --cached --quiet || git commit -m "log mentah $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
